[package]
name = "cmhm_sidecar"
version = "0.2.0"
edition = "2021"
description = "CMHM co-located embedding sidecar: batched model inference over loopback TCP (Expansion M5)"
license = "MIT"
repository = "https://github.com/cmhm/cmhm"

[lib]
name = "cmhm_sidecar"
path = "src/lib.rs"

[[bin]]
name = "cmhm_sidecar"
path = "src/main.rs"

[features]
default = []
onnx = ["cmhm_core/onnx"]

[dependencies]
cmhm_core = { path = "../cmhm_core" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = "1"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
parking_lot = "0.12"

[dev-dependencies]
tempfile = "3"
