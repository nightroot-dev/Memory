[workspace]
members = [
    "cmhm_core",
    "cmhm_mcp",
    "cmhm_gateway",
    "cmhm_sidecar",
]
resolver = "2"

[workspace.dependencies]
# Serialization
serde = { version = "=1.0.210", features = ["derive"] }
bincode = "1"
# Numerics
rand = { version = "0.8", features = ["small_rng"] }
libm = "0.2"
# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Async (MCP server)
tokio = { version = "1", features = ["full"] }
# Error handling
thiserror = "1"
anyhow = "1"
# Config
toml = "0.8"
serde_json = "1"
# OS-level file locking (scope writer locks, M1)
fs2 = "0.4"
# Authenticated encryption at rest (M3 storage seam)
aes-gcm = "0.10"
# Hashing (M6 backup manifests, gateway audit)
sha2 = "0.10"

[workspace.package]
version      = "0.2.0"
edition      = "2021"
license      = "MIT"
repository   = "https://github.com/cmhm/cmhm"
authors      = ["CMHM Contributors"]
