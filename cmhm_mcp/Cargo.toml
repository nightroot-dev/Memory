[package]
name = "cmhm_mcp"
version = "0.2.0"
edition = "2021"
description = "MCP stdio server exposing CMHM causal memory as tools"
license      = "MIT"
repository   = "https://github.com/cmhm/cmhm"
keywords     = ["mcp", "ai", "memory", "causal"]
categories   = ["command-line-utilities"]

[[bin]]
name = "cmhm_mcp"
path = "src/main.rs"

[lib]
name = "cmhm_mcp_lib"
path = "src/lib.rs"

[dependencies]
cmhm_core = { path = "../cmhm_core" }
serde = { workspace = true }
serde_json = "1"
schemars = { version = "0.8", features = ["preserve_order"] }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
base64 = "0.22"
parking_lot = "0.12"
uuid = { version = "1", features = ["v4"] }


[dev-dependencies]
tempfile = "3"

