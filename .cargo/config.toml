[build]
target = "x86_64-pc-windows-gnu"

[target.x86_64-pc-windows-gnu]
linker = "rust-lld"
ar = "C:/msys64/mingw64/bin/ar.exe"

# ─── Parallelism cap (prevents OOM on MSVC debug builds with fastembed/ORT) ──
# Uncomment if running: cargo +stable-msvc test --features onnx --workspace
# [build]
# jobs = 2

# ─── To activate the `onnx` feature (MiniLM-L6-v2-int8 embeddings) ───────────
#
# Run the recall benchmark with MiniLM:
#   cargo +stable-x86_64-pc-windows-msvc test --package cmhm_core --test recall_paraphrase --features onnx -j2 -- --nocapture
#
# Run the full onnx suite (package-by-package to avoid page file OOM):
#   cargo +stable-x86_64-pc-windows-msvc test --package cmhm_core --features onnx -j2
#   cargo +stable-x86_64-pc-windows-msvc test --package cmhm_mcp --features onnx -j2
#
# VS Build Tools 2022 installed at:
#   C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools
# MSVC stdlib installed: rustup target add x86_64-pc-windows-msvc (already done)
#
# The `Embedder` trait, OnnxEmbedder, feature flags, and all code wiring are in place.
# Default (no flags): GNU toolchain, hash-128d embedder — runs entire workspace suite.
